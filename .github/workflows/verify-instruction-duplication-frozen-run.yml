name: Verify frozen Instruction Duplication outputs

on:
  push:
    branches:
      - instruction-duplication-arxiv-v1-prep
    paths:
      - .github/workflows/verify-instruction-duplication-frozen-run.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instruction-duplication-arxiv-v1-prep
          fetch-depth: 0

      - name: Verify imported package is installable
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -c "import answer_engineering, ae_paper_reproduction, instruction_duplication"
          instruction-duplication --help >/dev/null

      - name: Fetch and audit frozen primary outputs
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/victorlavrenko/instruction-duplication.git /tmp/id-src
          git -C /tmp/id-src checkout cbb55629e53802056ac7554ccd5b9a11f39beb7f
          archive=/tmp/id-src/rejudged-3.0.13.tgz
          echo "archive SHA-256:"
          sha256sum "$archive"
          mkdir -p /tmp/frozen
          tar -xzf "$archive" -C /tmp/frozen

          python - <<'PY'
          from pathlib import Path
          import json

          workspace = Path('/tmp/frozen/run-2026-08-12')
          cells = workspace / 'results' / 'cells-and-judgments.jsonl'
          report = workspace / 'results' / 'paper-report.txt'
          analysis_path = workspace / 'results' / 'analysis.json'
          required_paths = [
              workspace / 'manifest.json',
              cells,
              report,
              analysis_path,
              workspace / 'results' / 'model-effects.csv',
              workspace / 'results' / 'model-effect-summary.csv',
              workspace / 'results' / 'blinded-matched-pair-audit.jsonl',
              workspace / 'results' / 'blinded-matched-pair-key.jsonl',
              workspace / 'results' / 'human-audit-schema.json',
          ]
          missing = [str(p) for p in required_paths if not p.is_file()]
          if missing:
              raise SystemExit(f'missing frozen output files: {missing}')

          row_count = sum(1 for _ in cells.open(encoding='utf-8'))
          assert row_count == 16800, row_count

          analysis = json.loads(analysis_path.read_text(encoding='utf-8'))
          text = report.read_text(encoding='utf-8')
          expected = {
              'scheduled': '16,800',
              'completed': '16,646',
              'all8_one': '90.22',
              'all8_two': '93.17',
              'tfidf_one': '73.44',
              'tfidf_two': '74.81',
              'accuracy': '60.21',
              'human_confirmations': '10/30',
              'human_ties': '20/30',
          }
          absent = {name: value for name, value in expected.items() if value not in text}
          if absent:
              raise SystemExit(f'paper report missing expected headline values: {absent}')

          print('FROZEN_CELL_ROWS=16800')
          print('HEADLINE_VALUES=verified')
          print('ANALYSIS_TOP_LEVEL_KEYS=', sorted(analysis))
          print('NOTE: this legacy archive is a frozen-output bundle, not a prepared CLI workspace;')
          print('full workspace regeneration requires the curated paper release inputs documented separately.')
          PY

      - name: Remove one-time verification workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-instruction-duplication-frozen-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time frozen-output verification workflow"
          git push origin HEAD:instruction-duplication-arxiv-v1-prep
