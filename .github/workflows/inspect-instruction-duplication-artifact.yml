name: Inspect frozen Instruction Duplication artifact

on:
  push:
    branches:
      - instruction-duplication-arxiv-v1-prep
    paths:
      - .github/workflows/inspect-instruction-duplication-artifact.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instruction-duplication-arxiv-v1-prep
          fetch-depth: 0

      - name: Fetch and inspect frozen run archive
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/victorlavrenko/instruction-duplication.git /tmp/id-src
          git -C /tmp/id-src checkout cbb55629e53802056ac7554ccd5b9a11f39beb7f
          archive=/tmp/id-src/rejudged-3.0.13.tgz
          echo "ARCHIVE_SIZE=$(stat -c %s "$archive")"
          sha256sum "$archive"
          echo "--- archive top-level entries ---"
          tar -tzf "$archive" | head -80 || true
          mkdir -p /tmp/id-run
          tar -xzf "$archive" -C /tmp/id-run
          echo "--- relevant frozen files ---"
          find /tmp/id-run -type f \( -name 'manifest.json' -o -name 'cells-and-judgments.jsonl' -o -name 'analysis.json' -o -name 'paper-report.txt' -o -name 'model-effects.csv' -o -name 'model-effect-summary.csv' \) -print | sort
          echo "--- directories ---"
          find /tmp/id-run -maxdepth 3 -type d | sort | head -120
          python - <<'PY'
          from pathlib import Path
          import json
          roots=list(Path('/tmp/id-run').rglob('cells-and-judgments.jsonl'))
          print('CELL_EXPORT_COUNT', len(roots))
          for p in roots:
              n=sum(1 for _ in p.open(encoding='utf-8'))
              print('CELL_EXPORT', p, 'ROWS', n)
          for p in Path('/tmp/id-run').rglob('analysis.json'):
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              print('ANALYSIS', p)
              print('ANALYSIS_KEYS', sorted(d)[:80])
          PY

      - name: Remove one-time inspection workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/inspect-instruction-duplication-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time artifact inspection workflow"
          git push origin HEAD:instruction-duplication-arxiv-v1-prep
